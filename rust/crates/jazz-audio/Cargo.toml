[package]
name = "jazz-audio"
description = "Synthesised jazz rhythm section: FM keys, upright bass, vibes, inharmonic ride and a swing scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
jazz-theory = { path = "../jazz-theory" }
# Optional: render pitched instruments from a General MIDI .sf2 instead of synthesis.
rustysynth = { version = "1.3", optional = true }

[features]
default = []
soundfont = ["dep:rustysynth"]
