<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Jazz Improvisation Lab</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0f1216;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e8ecf1}
  #jazz-canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:#0f1216;z-index:10;text-align:center;padding:24px}
  #boot h1{margin:0;font-size:26px;letter-spacing:.3px}
  #boot h1 span{color:#e0a63c}
  #boot p{margin:0;color:#9aa6b4;font-size:14px;max-width:34rem;line-height:1.5}
  #boot button{margin-top:6px;background:#e0a63c;color:#1a1206;border:none;border-radius:10px;
    padding:12px 26px;font-size:16px;font-weight:700;cursor:pointer}
  #boot button:disabled{opacity:.55;cursor:default}
  .bar{width:min(420px,80vw);height:6px;border-radius:99px;background:#232b36;overflow:hidden}
  .bar i{display:block;height:100%;width:35%;background:#4bb3a7;
    animation:slide 1.1s ease-in-out infinite}
  .bar.known i{animation:none;width:0;transition:width .2s ease}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(385%)}}
</style>
</head>
<body>
<canvas id="jazz-canvas"></canvas>

<div id="boot">
  <h1>The <span>Jazz Improvisation</span> Lab</h1>
  <p id="boot-msg">Loading&hellip; the first visit downloads a few megabytes.</p>
  <div class="bar" id="boot-bar"><i></i></div>
  <button id="boot-start" disabled>Start</button>
  <p style="font-size:12px">Sound starts when you press Start — browsers require a click before audio can play.</p>
</div>

<script type="module">
  // wasm-bindgen emits jazz-app.js next to this file; see build-wasm.ps1 / .sh
  import init from './jazz-app.js';

  const boot   = document.getElementById('boot');
  const msg    = document.getElementById('boot-msg');
  const bar    = document.getElementById('boot-bar');
  const fill   = bar.querySelector('i');
  const start  = document.getElementById('boot-start');

  // The band's real instruments: fetched before the app starts so the first
  // note is already FluidR3, with a byte-accurate bar when the server sends a
  // length. If the download fails the app still runs on its built-in synth.
  async function fetchSoundfont() {
    try {
      const res = await fetch('soundfont.sf2');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const total = Number(res.headers.get('Content-Length')) || 0;
      if (total && res.body) {
        bar.classList.add('known');
        const chunks = [];
        let got = 0;
        const reader = res.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          got += value.length;
          fill.style.width = Math.min(100, got / total * 100) + '%';
          msg.textContent = 'Downloading the band’s instruments… '
            + (got / 1048576).toFixed(0) + ' / ' + (total / 1048576).toFixed(0) + ' MB';
        }
        const bytes = new Uint8Array(got);
        let at = 0;
        for (const c of chunks) { bytes.set(c, at); at += c.length; }
        globalThis.JAZZ_SF2 = bytes;
      } else {
        msg.textContent = 'Downloading the band’s instruments…';
        globalThis.JAZZ_SF2 = new Uint8Array(await res.arrayBuffer());
      }
      return true;
    } catch (err) {
      console.warn('soundfont download failed; using the built-in synth', err);
      return false;
    }
  }

  Promise.all([init(), fetchSoundfont()])
    .then(([, gotSf2]) => {
      msg.textContent = gotSf2
        ? 'Ready.'
        : 'Ready (instrument download failed — using the built-in synth).';
      bar.style.display = 'none';
      start.disabled = false;
      start.focus();
    })
    .catch(err => {
      bar.style.display = 'none';
      msg.textContent = 'Could not start: ' + err;
      console.error(err);
    });

  // The click that dismisses this overlay is also the gesture that unlocks audio —
  // the Bevy app opens its output stream on the first input it sees, and takes
  // the soundfont bytes off JAZZ_SF2 at the same moment.
  start.addEventListener('click', () => {
    boot.remove();
    document.getElementById('jazz-canvas').focus();
  });
</script>
</body>
</html>
